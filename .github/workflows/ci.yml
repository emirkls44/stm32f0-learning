name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build all examples (arm-none-eabi-gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - name: Build
        run: cmake --build build
